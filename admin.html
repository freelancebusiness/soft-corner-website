<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المنتجات - RAFAH SOFT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
font-family:Arial,Tahoma,sans-serif;
background:#f8f5f2;
margin:0;
padding:20px;
color:#333
}

.container{
max-width:800px;
margin:auto
}

h1{text-align:center}

.box{
background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 3px 12px rgba(0,0,0,.08)
}

input,textarea,select,button{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ddd;
font-size:15px
}

textarea{
min-height:100px;
resize:vertical
}

button{
background:#333;
color:white;
cursor:pointer;
border:none
}

button:hover{opacity:.9}

.logout{background:#b33}

.product{
border:1px solid #eee;
padding:15px;
border-radius:10px;
margin-top:12px
}

.product img{
width:120px;
height:120px;
object-fit:cover;
border-radius:8px
}

.edit{
background:#c98b3c
}

.delete{
background:#b33
}

#adminPanel{display:none}

#message{
text-align:center;
font-weight:bold;
margin:10px 0
}

.stock-label{
display:flex;
align-items:center;
gap:8px;
margin:10px 0
}

.stock-label input{
width:auto
}

.actions{
display:flex;
gap:8px
}

.actions button{
flex:1
}

</style>
</head>

<body>

<div class="container">

<h1>لوحة إدارة المنتجات 🛍️</h1>

<!-- تسجيل الدخول -->

<div class="box" id="loginBox">

<h2>تسجيل الدخول</h2>

<input
type="email"
id="email"
placeholder="البريد الإلكتروني"
>

<input
type="password"
id="password"
placeholder="كلمة المرور"
>

<button onclick="login()">دخول</button>

</div>


<!-- لوحة الإدارة -->

<div id="adminPanel">

<div class="box">

<h2 id="formTitle">إضافة منتج جديد ➕</h2>

<input
type="text"
id="name"
placeholder="اسم المنتج"
>

<input
type="number"
id="price"
placeholder="السعر"
step="0.01"
>

<input
type="number"
id="discount"
placeholder="الخصم % مثال: 10"
step="0.01"
>

<textarea
id="description"
placeholder="وصف المنتج"
></textarea>

<input
type="text"
id="sizes"
placeholder="المقاسات مثال: S,M,L,XL"
>

<label>القسم</label>

<select id="category">

<option value="">اختاري القسم</option>

<option value="حريمي بيتي">حريمي بيتي</option>
<option value="حريمي خارجي">حريمي خارجي</option>
<option value="رجالي داخلي">رجالي داخلي</option>
<option value="رجالي خارجي">رجالي خارجي</option>
<option value="أطفال داخلي">أطفال داخلي</option>
<option value="أطفال خارجي">أطفال خارجي</option>

</select>

<label class="stock-label">

<input
type="checkbox"
id="stock"
checked
>

المنتج متوفر

</label>

<label>صورة المنتج</label>

<input
type="file"
id="image"
accept="image/*"
>

<button id="saveButton" onclick="saveProduct()">
إضافة المنتج
</button>

<button
id="cancelButton"
onclick="cancelEdit()"
style="display:none;background:#777"
>
إلغاء التعديل
</button>

<div id="message"></div>

</div>


<!-- المنتجات -->

<div class="box">

<h2>المنتجات الحالية 📦</h2>

<div id="productsList">
جاري تحميل المنتجات...
</div>

</div>

<button
class="logout"
onclick="logout()"
>
تسجيل الخروج
</button>

</div>

</div>


<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL =
"https://dzykruhsbfbxxivekfhq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CNTMX5leuWKhzuF5m1py_g_kHmTND_d";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* المنتج الذي يتم تعديله */

let editingId = null;
let editingOldImage = "";


/* =========================
   تسجيل الدخول
========================= */

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){

alert("اكتبي البريد الإلكتروني وكلمة المرور");

return;
}

const {error} =
await supabaseClient.auth.signInWithPassword({

email:email,
password:password

});

if(error){

alert(
"خطأ في تسجيل الدخول: " +
error.message
);

return;
}

showAdmin();

}


/* =========================
   إظهار الإدارة
========================= */

function showAdmin(){

document.getElementById("loginBox").style.display="none";

document.getElementById("adminPanel").style.display="block";

loadProducts();

}


/* =========================
   حفظ المنتج
========================= */

async function saveProduct(){

const name =
document.getElementById("name").value.trim();

const price =
document.getElementById("price").value;

const discount =
document.getElementById("discount").value || 0;

const description =
document.getElementById("description").value.trim();

const sizes =
document.getElementById("sizes").value.trim();

const category =
document.getElementById("category").value;

const stock =
document.getElementById("stock").checked;

const imageFile =
document.getElementById("image").files[0];


if(!name || !price){

alert("اكتبي اسم المنتج والسعر");

return;
}

if(!category){

alert("اختاري القسم");

return;
}


let imageUrl = editingOldImage;


/* =========================
   رفع صورة جديدة
========================= */

if(imageFile){

const safeName =
imageFile.name
.replace(/\s+/g,"-")
.replace(/[^a-zA-Z0-9._-]/g,"");

const fileName =
Date.now() + "-" + safeName;


const {error:uploadError} =
await supabaseClient.storage
.from("product-images")
.upload(
fileName,
imageFile
);


if(uploadError){

alert(
"حدث خطأ أثناء رفع الصورة: " +
uploadError.message
);

return;
}


const {data} =
supabaseClient.storage
.from("product-images")
.getPublicUrl(fileName);


imageUrl =
data.publicUrl;

}


/* =========================
   تعديل
========================= */

if(editingId){

const {error} =
await supabaseClient
.from("products")
.update({

name:name,
price:Number(price),
discount:Number(discount),
description:description,
image_url:imageUrl,
sizes:sizes,
category:category,
stock:stock

})
.eq("id",editingId);


if(error){

alert(
"حدث خطأ أثناء التعديل: " +
error.message
);

return;
}


document.getElementById("message").innerText =
"تم تعديل المنتج بنجاح ✅";


}else{


/* =========================
   إضافة
========================= */

const {error} =
await supabaseClient
.from("products")
.insert({

name:name,
price:Number(price),
discount:Number(discount),
description:description,
image_url:imageUrl,
sizes:sizes,
category:category,
stock:stock

});


if(error){

alert(
"حدث خطأ أثناء الإضافة: " +
error.message
);

return;
}


document.getElementById("message").innerText =
"تم إضافة المنتج بنجاح ✅";

}


clearForm();

loadProducts();

}


/* =========================
   تنظيف النموذج
========================= */

function clearForm(){

document.getElementById("name").value="";

document.getElementById("price").value="";

document.getElementById("discount").value="";

document.getElementById("description").value="";

document.getElementById("sizes").value="";

document.getElementById("category").value="";

document.getElementById("stock").checked=true;

document.getElementById("image").value="";

editingId=null;

editingOldImage="";

document.getElementById("formTitle").innerText =
"إضافة منتج جديد ➕";

document.getElementById("saveButton").innerText =
"إضافة المنتج";

document.getElementById("cancelButton").style.display =
"none";

}


/* =========================
   تعديل منتج
========================= */

function editProduct(product){

editingId = product.id;

editingOldImage =
product.image_url || "";


document.getElementById("name").value =
product.name || "";

document.getElementById("price").value =
product.price || "";

document.getElementById("discount").value =
product.discount || "";

document.getElementById("description").value =
product.description || "";

document.getElementById("sizes").value =
product.sizes || "";

document.getElementById("category").value =
product.category || "";

document.getElementById("stock").checked =
product.stock !== false;

document.getElementById("image").value="";


document.getElementById("formTitle").innerText =
"تعديل المنتج ✏️";

document.getElementById("saveButton").innerText =
"حفظ التعديل";

document.getElementById("cancelButton").style.display =
"block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   إلغاء التعديل
========================= */

function cancelEdit(){

clearForm();

}


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

const list =
document.getElementById("productsList");

list.innerHTML =
"جاري تحميل المنتجات...";


const {data,error} =
await supabaseClient
.from("products")
.select("*")
.order("created_at",{ascending:false});


if(error){

list.innerHTML =
"حدث خطأ أثناء تحميل المنتجات ❌";

console.error(error);

return;
}


if(!data || data.length===0){

list.innerHTML =
"<p>لا توجد منتجات حتى الآن.</p>";

return;
}


list.innerHTML="";


data.forEach(product=>{

const div =
document.createElement("div");

div.className="product";


div.innerHTML = `

${
product.image_url
?
`<img src="${product.image_url}" alt="">`
:
""
}

<h3>${product.name}</h3>

<p>
السعر: ${product.price} LE
</p>

<p>
الخصم: ${product.discount || 0}%
</p>

<p>
القسم: ${product.category || "غير محدد"}
</p>

<p>
المقاسات: ${product.sizes || "غير محدد"}
</p>

<p>
${
product.stock
?
"متوفر ✅"
:
"غير متوفر ❌"
}
</p>

<div class="actions">

<button
class="edit"
onclick='editProduct(${JSON.stringify(product)})'
>
تعديل ✏️
</button>

<button
class="delete"
onclick="deleteProduct('${product.id}','${encodeURIComponent(product.image_url || "")}')"
>
حذف 🗑️
</button>

</div>

`;

list.appendChild(div);

});

}


/* =========================
   حذف المنتج
========================= */

async function deleteProduct(id,encodedImage){

const answer =
confirm(
"هل أنتِ متأكدة من حذف المنتج؟"
);

if(!answer)return;


const {error} =
await supabaseClient
.from("products")
.delete()
.eq("id",id);


if(error){

alert(
"حدث خطأ أثناء الحذف: " +
error.message
);

return;
}


/* حذف الصورة من Storage */

if(encodedImage){

try{

const imageUrl =
decodeURIComponent(encodedImage);

const marker =
"/product-images/";

const position =
imageUrl.indexOf(marker);


if(position !== -1){

const filePath =
imageUrl.substring(
position + marker.length
);


await supabaseClient.storage
.from("product-images")
.remove([filePath]);

}

}catch(e){

console.log(e);

}

}


alert("تم حذف المنتج ✅");

loadProducts();

}


/* =========================
   تسجيل الخروج
========================= */

async function logout(){

await supabaseClient.auth.signOut();

location.reload();

}


/* =========================
   التحقق من الدخول
========================= */

async function checkUser(){

const {
data:{
session
}
} =
await supabaseClient.auth.getSession();


if(session){

showAdmin();

}

}


checkUser();

</script>

</body>
</html>
